name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/ingestion/go.mod
          cache-dependency-path: services/ingestion/go.sum

      - name: Install hash-locked Python environment
        run: make install PYTHON3=python

      - name: Check generated and compiled source
        shell: bash
        run: |
          git diff --check
          .venv/bin/python -m compileall -q fraudwatch_ml scripts services tests
          test -z "$(gofmt -l services/ingestion)"
          (cd services/ingestion && go vet ./...)
          kubectl kustomize infra/k8s/overlays/local >/tmp/fraudwatch-local.yaml
          kubectl kustomize infra/k8s/overlays/ci >/tmp/fraudwatch-ci.yaml
          kubectl kustomize infra/observability >/tmp/fraudwatch-observability.yaml

      - name: Run Python and Go integration tests
        run: make test

      - name: Validate and test alert rules
        run: |
          make observability-k8s-check
          make alerts-test

      - name: Stop integration services
        if: always()
        run: make down-all

  kind-e2e:
    name: Kind end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock

      - name: Install hash-locked Python environment
        run: make install PYTHON3=python

      - name: Install pinned Kind
        shell: bash
        run: |
          curl -fsSLo "${RUNNER_TEMP}/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.22.0/kind-linux-amd64
          echo "e4264d7ee07ca642fe52818d7c0ed188b193c214889dd055c929dbcb968d1f62  ${RUNNER_TEMP}/kind" \
            | sha256sum --check
          sudo install -m 0755 "${RUNNER_TEMP}/kind" /usr/local/bin/kind

      - name: Build CI model fixture and local credentials
        shell: bash
        run: |
          .venv/bin/python scripts/build_ci_model_fixture.py \
            --output artifacts/candidate-model
          .venv/bin/python scripts/init_k8s_secrets.py \
            "${RUNNER_TEMP}/fraudwatch-ci.env"

      - name: Build, load, and deploy exact images
        run: |
          make k8s-ci-up \
            PYTHON3=python \
            K8S_CI_SECRET_ENV="${RUNNER_TEMP}/fraudwatch-ci.env"

      - name: Run Kubernetes end-to-end smoke test
        run: make k8s-ci-smoke PYTHON3=python

      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/ci-diagnostics
          kubectl --context kind-fraudwatch-ci -n fraudwatch get \
            pods,services,statefulsets,deployments,jobs,pvc -o wide \
            > artifacts/ci-diagnostics/resources.txt 2>&1 || true
          kubectl --context kind-fraudwatch-ci -n fraudwatch get events \
            --sort-by=.lastTimestamp \
            > artifacts/ci-diagnostics/events.txt 2>&1 || true
          kubectl --context kind-fraudwatch-ci -n fraudwatch describe pods \
            > artifacts/ci-diagnostics/pods.txt 2>&1 || true
          kubectl --context kind-fraudwatch-ci -n fraudwatch logs \
            --selector app.kubernetes.io/part-of=fraudwatch \
            --all-containers=true --prefix=true \
            > artifacts/ci-diagnostics/logs.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kind-diagnostics
          path: artifacts/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete ephemeral cluster
        if: always()
        run: make k8s-ci-delete
