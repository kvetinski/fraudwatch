# Local Linux deployment overlay. Applied on top of infra/compose.yaml.
# Relative paths are resolved from infra/, i.e. the FIRST Compose file.
# Application builds use host networking so dependency downloads follow the
# host's working DNS/VPN routes. Runtime containers still use Compose networks.
# Prometheus/Grafana remain managed by infra/compose.observability.yaml,
# using host networking to scrape loopback-only published worker metrics.
x-app-security: &app-security
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]

services:
  kafka:
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s

  ingestion:
    <<: *app-security
    image: fraudwatch/ingestion:${FRAUDWATCH_APP_TAG:-development}
    build:
      context: ../services/ingestion
      dockerfile: Dockerfile
      network: host
      args:
        FRAUDWATCH_BUILD_REVISION: ${FRAUDWATCH_BUILD_REVISION:-development}
    environment:
      DATABASE_URL: postgres://fraudwatch:fraudwatch_dev@postgres:5432/fraudwatch?sslmode=disable
      KAFKA_BROKERS: kafka:19092
      FRAUDWATCH_HTTP_ADDR: 0.0.0.0:8080
      FRAUDWATCH_DB_MAX_CONNS: "20"
      FRAUDWATCH_DB_MIN_CONNS: "2"
      FRAUDWATCH_BUILD_REVISION: ${FRAUDWATCH_BUILD_REVISION:-development}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

  scoring:
    <<: *app-security
    image: fraudwatch/scoring:${FRAUDWATCH_SCORING_TAG:-development}
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      network: host
      target: scoring
      args:
        FRAUDWATCH_BUILD_REVISION: ${FRAUDWATCH_BUILD_REVISION:-development}
        FRAUDWATCH_MODEL_DIGEST: ${FRAUDWATCH_MODEL_DIGEST:-unknown}
        FRAUDWATCH_MODEL_BUNDLE_DIGEST: ${FRAUDWATCH_MODEL_BUNDLE_DIGEST:-unknown}
    environment:
      DATABASE_URL: postgres://fraudwatch:fraudwatch_dev@postgres:5432/fraudwatch?sslmode=disable
      KAFKA_BROKERS: kafka:19092
      FRAUDWATCH_METRICS_BIND: 0.0.0.0
      FRAUDWATCH_SCORING_METRICS_PORT: "9101"
      FRAUDWATCH_MODEL_DIR: /models/candidate
      FRAUDWATCH_DB_PREPARE_THRESHOLD: "1"
      FRAUDWATCH_NATIVE_MATH_THREADS: "1"
      FRAUDWATCH_SCORING_BATCH_SIZE_PER_PARTITION: "8"
      FRAUDWATCH_SCORING_BATCH_WAIT_SECONDS: "0.025"
      FRAUDWATCH_BUILD_REVISION: ${FRAUDWATCH_BUILD_REVISION:-development}
    ports:
      - "127.0.0.1:9101:9101"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/readyz', timeout=2).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0

  labels:
    <<: *app-security
    image: fraudwatch/labels:${FRAUDWATCH_APP_TAG:-development}
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      network: host
      target: labels
      args:
        FRAUDWATCH_BUILD_REVISION: ${FRAUDWATCH_BUILD_REVISION:-development}
    environment:
      DATABASE_URL: postgres://fraudwatch:fraudwatch_dev@postgres:5432/fraudwatch?sslmode=disable
      KAFKA_BROKERS: kafka:19092
      FRAUDWATCH_METRICS_BIND: 0.0.0.0
      FRAUDWATCH_LABEL_METRICS_PORT: "9102"
      FRAUDWATCH_DB_PREPARE_THRESHOLD: "1"
      FRAUDWATCH_LABEL_BATCH_SIZE_PER_PARTITION: "64"
      FRAUDWATCH_LABEL_BATCH_WAIT_SECONDS: "0.025"
      FRAUDWATCH_BUILD_REVISION: ${FRAUDWATCH_BUILD_REVISION:-development}
    ports:
      - "127.0.0.1:9102:9102"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/readyz', timeout=2).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped
    pids_limit: 192
    mem_limit: 512m
    cpus: 1.0

  model-monitor-evaluator:
    <<: *app-security
    image: fraudwatch/model-monitor:${FRAUDWATCH_SCORING_TAG:-development}
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      network: host
      target: model-monitor
      args:
        FRAUDWATCH_BUILD_REVISION: ${FRAUDWATCH_BUILD_REVISION:-development}
        FRAUDWATCH_MODEL_DIGEST: ${FRAUDWATCH_MODEL_DIGEST:-unknown}
        FRAUDWATCH_MODEL_BUNDLE_DIGEST: ${FRAUDWATCH_MODEL_BUNDLE_DIGEST:-unknown}
    command: ["--database-url", "postgres://fraudwatch:fraudwatch_dev@postgres:5432/fraudwatch?sslmode=disable", "schedule", "--baseline", "/models/candidate/monitoring-baseline.json"]
    environment:
      FRAUDWATCH_BUILD_REVISION: ${FRAUDWATCH_BUILD_REVISION:-development}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    pids_limit: 192
    mem_limit: 1g
    cpus: 1.0

  operations:
    <<: *app-security
    image: fraudwatch/operations:${FRAUDWATCH_APP_TAG:-development}
    profiles: [tools]
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      network: host
      target: operations
      args:
        FRAUDWATCH_BUILD_REVISION: ${FRAUDWATCH_BUILD_REVISION:-development}
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
