apiVersion: v1
kind: Service
metadata:
  name: ingestion
  labels:
    app.kubernetes.io/name: ingestion
spec:
  selector:
    app.kubernetes.io/name: ingestion
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  labels:
    app.kubernetes.io/name: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ingestion
          image: fraudwatch/ingestion:development
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: fraudwatch-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fraudwatch-secrets, key: DATABASE_URL}
            - name: FRAUDWATCH_HTTP_ADDR
              value: 0.0.0.0:8080
            - name: FRAUDWATCH_DB_MAX_CONNS
              value: "20"
            - name: FRAUDWATCH_DB_MIN_CONNS
              value: "2"
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
      terminationGracePeriodSeconds: 30
