apiVersion: v1
kind: Service
metadata:
  name: labels
  labels:
    app.kubernetes.io/name: labels
spec:
  selector:
    app.kubernetes.io/name: labels
  ports:
    - name: metrics
      port: 9102
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labels
  labels:
    app.kubernetes.io/name: labels
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: labels
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: labels
          image: fraudwatch/labels:development
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: fraudwatch-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fraudwatch-secrets, key: DATABASE_URL}
            - {name: FRAUDWATCH_LABEL_METRICS_PORT, value: "9102"}
          ports:
            - {name: metrics, containerPort: 9102}
          startupProbe:
            httpGet: {path: /livez, port: metrics}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
      terminationGracePeriodSeconds: 60
