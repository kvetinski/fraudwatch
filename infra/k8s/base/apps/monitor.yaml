apiVersion: v1
kind: Service
metadata:
  name: monitor
  labels:
    app.kubernetes.io/name: monitor
spec:
  selector:
    app.kubernetes.io/name: monitor
  ports:
    - name: metrics
      port: 9103
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  labels:
    app.kubernetes.io/name: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: monitor
          image: fraudwatch/monitor:development
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: fraudwatch-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fraudwatch-secrets, key: DATABASE_URL_READ_ONLY}
            - {name: FRAUDWATCH_MONITOR_METRICS_PORT, value: "9103"}
          ports:
            - {name: metrics, containerPort: 9103}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
      terminationGracePeriodSeconds: 30
