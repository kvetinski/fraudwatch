apiVersion: v1
kind: Service
metadata:
  name: scoring
  labels:
    app.kubernetes.io/name: scoring
spec:
  selector:
    app.kubernetes.io/name: scoring
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring
  labels:
    app.kubernetes.io/name: scoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scoring
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: scoring
          image: fraudwatch/scoring:development
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: fraudwatch-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fraudwatch-secrets, key: DATABASE_URL}
            - {name: FRAUDWATCH_SCORING_METRICS_PORT, value: "9101"}
          ports:
            - {name: metrics, containerPort: 9101}
          startupProbe:
            httpGet: {path: /livez, port: metrics}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
      terminationGracePeriodSeconds: 60
