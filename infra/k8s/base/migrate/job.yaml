apiVersion: batch/v1
kind: Job
metadata:
  name: fraudwatch-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraudwatch-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: fraudwatch/operations:development
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/scripts/migrate_database.py"]
          args: ["--database-url", "$(DATABASE_URL)"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: fraudwatch-secrets, key: DATABASE_URL}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
