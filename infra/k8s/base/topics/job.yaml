apiVersion: batch/v1
kind: Job
metadata:
  name: fraudwatch-topics
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraudwatch-topics
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: topics
          image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for topic in transactions.v1 fraud-labels.v1; do
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server kafka:19092 \
                  --create --if-not-exists \
                  --topic "$topic" --partitions 3 --replication-factor 1
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server kafka:19092 \
                  --describe --topic "$topic"
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
