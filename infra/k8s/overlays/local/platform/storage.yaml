apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fraudwatch
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
