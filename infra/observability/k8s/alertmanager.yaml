apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels: {app.kubernetes.io/name: alertmanager}
spec:
  selector: {app.kubernetes.io/name: alertmanager}
  ports:
    - {name: http, port: 9093, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels: {app.kubernetes.io/name: alertmanager}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: alertmanager}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alertmanager}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=0.0.0.0:9093
          ports:
            - {name: http, containerPort: 9093}
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml, readOnly: true}
            - {name: data, mountPath: /alertmanager}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: alertmanager-config}
        - name: data
          persistentVolumeClaim: {claimName: alertmanager-data}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
