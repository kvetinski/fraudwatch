apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels: {app.kubernetes.io/name: alloy}
spec:
  selector: {app.kubernetes.io/name: alloy}
  ports:
    - {name: http, port: 12345, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: {app.kubernetes.io/name: alloy}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: alloy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alloy}
    spec:
      serviceAccountName: alloy
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alloy
          image: grafana/alloy:v1.11.3@sha256:8c7256f412feb9f5f48f9f6f9394dc97ca887f63dea9304f347970ecc1787669
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - {name: http, containerPort: 12345}
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy/config.alloy, subPath: config.alloy, readOnly: true}
            - {name: data, mountPath: /var/lib/alloy/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: alloy-config}
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
