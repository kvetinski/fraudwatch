apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  selector: {app.kubernetes.io/name: kube-state-metrics}
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
    - {name: telemetry, port: 8081, targetPort: telemetry}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.14.0@sha256:37d841299325c23b56e5951176ce8ef317d537447c0f1b2d2437dddbb1f51165
          imagePullPolicy: IfNotPresent
          args:
            - --namespaces=fraudwatch
            - --resources=pods,deployments,statefulsets,jobs
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /metrics, port: telemetry}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /metrics, port: telemetry}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
