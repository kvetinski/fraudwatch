apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: {app.kubernetes.io/name: loki}
spec:
  selector: {app.kubernetes.io/name: loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: {app.kubernetes.io/name: loki}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: loki}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loki
          image: grafana/loki:3.7.0@sha256:c316b7c7589a5eeca843b6926c7446149d18300b79ac8538dc4ae063bc478da2
          imagePullPolicy: IfNotPresent
          args: [-config.file=/etc/loki/loki.yml]
          ports:
            - {name: http, containerPort: 3100}
          livenessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 750m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki/loki.yml, subPath: loki.yml, readOnly: true}
            - {name: data, mountPath: /loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          persistentVolumeClaim: {claimName: loki-data}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
