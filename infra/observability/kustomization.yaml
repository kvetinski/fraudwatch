apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraudwatch
resources:
  - k8s/rbac.yaml
  - k8s/storage.yaml
  - k8s/prometheus.yaml
  - k8s/alertmanager.yaml
  - k8s/loki.yaml
  - k8s/alloy.yaml
  - k8s/grafana.yaml
  - k8s/kube-state-metrics.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=k8s/config/prometheus.yml
  - name: prometheus-rules
    files:
      - fraudwatch-alerts.yml=rules/fraudwatch-alerts.yml
  - name: alertmanager-config
    files:
      - alertmanager.yml=alertmanager.yml
  - name: loki-config
    files:
      - loki.yml=k8s/config/loki.yml
  - name: alloy-config
    files:
      - config.alloy=k8s/config/config.alloy
  - name: grafana-provisioning
    files:
      - dashboard.yml=grafana/provisioning/dashboards/dashboard.yml
      - prometheus.yml=k8s/config/grafana-prometheus.yml
      - loki.yml=k8s/config/grafana-loki.yml
  - name: grafana-dashboards
    files:
      - grafana/dashboards/fraudwatch-services.json
      - grafana/dashboards/fraudwatch-streaming.json
      - grafana/dashboards/fraudwatch-reliability.json
      - grafana/dashboards/fraudwatch-model-quality.json
      - k8s/config/fraudwatch-kubernetes.json
commonLabels:
  app.kubernetes.io/part-of: fraudwatch
  app.kubernetes.io/component: observability
