global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: fraudwatch-scoring
    static_configs:
      - targets: ['127.0.0.1:9101']
  - job_name: fraudwatch-labels
    static_configs:
      - targets: ['127.0.0.1:9102']
