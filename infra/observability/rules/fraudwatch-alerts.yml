groups:
  - name: fraudwatch-availability
    interval: 30s
    rules:
      - alert: FraudWatchServiceDown
        expr: up{job=~"fraudwatch-ingestion|fraudwatch-scoring|fraudwatch-labels|fraudwatch-monitor"} == 0
        for: 2m
        labels: {severity: critical, service: fraudwatch}
        annotations:
          summary: "FraudWatch service exporter is unavailable"
          description: "Prometheus has been unable to scrape {{ $labels.job }} for two minutes."

      - alert: FraudWatchMonitorStale
        expr: absent(fraudwatch_monitor_last_success_unixtime) or (time() - fraudwatch_monitor_last_success_unixtime > 120)
        for: 2m
        labels: {severity: critical, service: fraudwatch}
        annotations:
          summary: "FraudWatch independent monitoring is stale"
          description: "Kafka and PostgreSQL state has not been collected successfully for more than two minutes."

      - alert: FraudWatchKubernetesDeploymentUnavailable
        expr: kube_deployment_status_replicas_unavailable{namespace="fraudwatch"} > 0
        for: 5m
        labels: {severity: critical, service: fraudwatch}
        annotations:
          summary: "FraudWatch Kubernetes deployment is unavailable"
          description: "Deployment {{ $labels.deployment }} has unavailable replicas for five minutes."

      - alert: FraudWatchKubernetesCrashLoop
        expr: kube_pod_container_status_waiting_reason{namespace="fraudwatch",reason="CrashLoopBackOff"} > 0
        for: 5m
        labels: {severity: critical, service: fraudwatch}
        annotations:
          summary: "FraudWatch container is crash-looping"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is in CrashLoopBackOff."

  - name: fraudwatch-streaming
    interval: 30s
    rules:
      - alert: FraudWatchConsumerLagHigh
        expr: sum by (group, topic) (fraudwatch_kafka_consumer_group_lag) > 1000
        for: 5m
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch Kafka consumer lag is high"
          description: "Consumer group {{ $labels.group }} has exceeded 1,000 pending records for five minutes."

      - alert: FraudWatchConsumerStalled
        expr: |
          sum by (group) (fraudwatch_kafka_consumer_group_lag) > 0
          and on (group)
          (
            label_replace(sum(rate(fraudwatch_scoring_events_total[5m])), "group", "fraudwatch-scoring-v1", "", "") == 0
            or label_replace(sum(rate(fraudwatch_labels_events_total[5m])), "group", "fraudwatch-labels-v1", "", "") == 0
          )
        for: 5m
        labels: {severity: critical, service: fraudwatch}
        annotations:
          summary: "FraudWatch consumer is stalled with backlog"
          description: "Consumer group {{ $labels.group }} has lag but no acknowledged records."

      - alert: FraudWatchKafkaCommitFailure
        expr: sum by (job) (increase({__name__=~"fraudwatch_(scoring|labels)_kafka_commits_total",result="failure"}[5m])) > 0
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch Kafka offset commit failed"
          description: "{{ $labels.job }} reported at least one synchronous commit failure in five minutes."

      - alert: FraudWatchWorkerErrorRatioHigh
        expr: |
          (sum(rate({__name__=~"fraudwatch_(scoring|labels)_errors_total"}[5m])) or vector(0))
          /
          clamp_min(
            (sum(rate({__name__=~"fraudwatch_(scoring|labels)_events_total"}[5m])) or vector(0))
            + (sum(rate({__name__=~"fraudwatch_(scoring|labels)_errors_total"}[5m])) or vector(0)),
            0.001
          )
          > 0.05
          and (
            (sum(increase({__name__=~"fraudwatch_(scoring|labels)_events_total"}[5m])) or vector(0))
            + (sum(increase({__name__=~"fraudwatch_(scoring|labels)_errors_total"}[5m])) or vector(0))
          ) > 100
        for: 5m
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch worker error ratio exceeds 5%"
          description: "The combined scoring/label error ratio is above 5% with meaningful traffic."

      - alert: FraudWatchIngestionErrorRatioHigh
        expr: |
          sum(rate(fraudwatch_ingestion_requests_total{outcome="unavailable"}[5m]))
          /
          clamp_min(sum(rate(fraudwatch_ingestion_requests_total[5m])), 0.001)
          > 0.05
          and sum(increase(fraudwatch_ingestion_requests_total[5m])) > 100
        for: 5m
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch ingestion error ratio exceeds 5%"
          description: "Durable transaction acceptance failures exceed 5% with meaningful traffic."

      - alert: FraudWatchScoringLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(fraudwatch_scoring_stage_seconds_bucket{stage="total"}[5m]))) > 0.100
          and sum(increase(fraudwatch_scoring_stage_seconds_count{stage="total"}[5m])) > 100
        for: 5m
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch scoring p95 latency exceeds 100 ms"
          description: "Acknowledgment latency has exceeded the Phase 3.12 gate for five minutes."

      - alert: FraudWatchIngestionLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(fraudwatch_ingestion_request_duration_seconds_bucket[5m]))) > 0.250
          and sum(increase(fraudwatch_ingestion_request_duration_seconds_count[5m])) > 100
        for: 5m
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch ingestion p95 latency exceeds 250 ms"
          description: "HTTP acceptance through the PostgreSQL commit boundary is persistently slow."

  - name: fraudwatch-reliability
    interval: 30s
    rules:
      - alert: FraudWatchOutboxBacklogOld
        expr: fraudwatch_outbox_oldest_pending_age_seconds > 60
        for: 5m
        labels: {severity: critical, service: fraudwatch}
        annotations:
          summary: "FraudWatch outbox publication is delayed"
          description: "The oldest accepted transaction has waited more than one minute for Kafka publication."

      - alert: FraudWatchPendingQuarantineOld
        expr: fraudwatch_quarantine_oldest_pending_age_seconds > 600
        for: 5m
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch quarantine needs operator review"
          description: "A {{ $labels.event_type }} quarantine has remained pending for more than ten minutes."

      - alert: FraudWatchBlockedTerminalOld
        expr: fraudwatch_blocked_terminal_oldest_age_seconds > 600
        for: 5m
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch terminal block needs reconciliation"
          description: "At least one terminal has remained blocked for more than ten minutes."

      - alert: FraudWatchPendingLabelOld
        expr: fraudwatch_pending_label_oldest_age_seconds > 86400
        for: 30m
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch pending label is unexpectedly old"
          description: "A valid delayed label has waited over one day for its transaction."

  - name: fraudwatch-model
    interval: 1m
    rules:
      - alert: FraudWatchModelMonitoringStale
        expr: absent(fraudwatch_model_monitor_snapshot_present) or fraudwatch_model_monitor_snapshot_present == 0 or fraudwatch_model_monitor_snapshot_age_seconds > 129600
        for: 15m
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch model monitoring snapshot is stale"
          description: "No model-quality evaluation has completed in the last 36 hours."

      - alert: FraudWatchModelDriftWarning
        expr: fraudwatch_model_monitor_alert_eligible == 1 and on() (max(fraudwatch_model_score_psi or fraudwatch_model_feature_psi) > 0.20) and on() (max(fraudwatch_model_score_psi or fraudwatch_model_feature_psi) <= 0.30)
        for: 15m
        labels: {severity: warning, service: fraudwatch}
        annotations:
          summary: "FraudWatch model population drift exceeds PSI 0.20"
          description: "Score or feature drift is above the initial warning threshold with sufficient samples and positives."

      - alert: FraudWatchModelDriftCritical
        expr: fraudwatch_model_monitor_alert_eligible == 1 and on() (max(fraudwatch_model_score_psi or fraudwatch_model_feature_psi) > 0.30)
        for: 15m
        labels: {severity: critical, service: fraudwatch}
        annotations:
          summary: "FraudWatch model population drift exceeds PSI 0.30"
          description: "Score or feature drift is above the initial critical threshold with sufficient evidence."

      - alert: FraudWatchModelQualityRegression
        expr: fraudwatch_model_monitor_alert_eligible == 1 and on() (max(fraudwatch_model_quality_degradation_ratio) > 0.20)
        for: 15m
        labels: {severity: critical, service: fraudwatch}
        annotations:
          summary: "FraudWatch model quality degraded by more than 20%"
          description: "At least one delayed-label quality metric regressed over 20% from its validation baseline."
