[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudwatch-ml"
version = "0.1.0"
description = "FraudWatch machine learning and feature engineering"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "scikit-learn>=1.5,<2",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
]
mlops = [
    "mlflow>=3.7,<4",
]
streaming = [
    "confluent-kafka>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["fraudwatch_ml*"]
